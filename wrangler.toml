#:schema node_modules/wrangler/config-schema.json
name = "whosedog"
main = "src/index.js"
compatibility_date = "2026-09-17"
workers_dev = false

# Attaches the domain on deploy. The Pages project aaron-landry-status must
# have its whose.dog custom domain removed first, or routing will conflict.
routes = [
  { pattern = "whose.dog/*", zone_name = "whose.dog" }
]

# The watcher. Evaluates overdue state and queues alerts.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "whosedog"
database_id = "528849a1-f8df-4f84-b66e-3e64fc3bed9f"

[vars]
CHECKIN_PATH = "arf"

# Secrets (set via `wrangler secret put`, never in this file):
#   SEED_KEY       - base64 AES-256 key encrypting TOTP seeds at rest
#   NTFY_TOPIC     - ntfy.sh topic string
#   POLLER_TOKEN   - bearer token umbricor uses to drain the alert queue
