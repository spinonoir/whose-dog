<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>whose.dog</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #fdf6ec;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Georgia', serif;
    }

    h1 {
      font-size: 3rem;
      color: #5a3e2b;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
    }

    .dog-container {
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(90, 62, 43, 0.18);
      max-width: 90vw;
    }

    .dog-container img {
      display: block;
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
    }

    p {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      color: #a0704a;
    }
  </style>
</head>
<body>
  <h1>whose.dog</h1>
  <div class="dog-container">
    <img src="whose_dog.jpg" alt="whose dog is this?" />
  </div>
  <p>whose dog is this? 🐾</p>
</body>
</html>
